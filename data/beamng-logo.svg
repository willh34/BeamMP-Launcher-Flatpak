<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68">
  <!-- Dark circular background -->
  <circle cx="34" cy="34" r="33" fill="#0d1b2a"/>
  <circle cx="34" cy="34" r="33" fill="none" stroke="#1565c0" stroke-width="1.5"/>

  <!-- Road surface -->
  <path d="M10 44 Q34 38 58 44" stroke="#1e3a5f" stroke-width="7"
        fill="none" stroke-linecap="round"/>

  <!-- Car body -->
  <rect x="16" y="28" width="36" height="13" rx="5" fill="#1976d2"/>

  <!-- Roof / cabin -->
  <path d="M21 28 Q25 19 34 18 Q43 19 47 28Z" fill="#42a5f5"/>

  <!-- Windscreen tint -->
  <path d="M24 28 Q27 21 34 20 Q41 21 44 28Z" fill="#90caf9" opacity="0.55"/>

  <!-- Door line detail -->
  <line x1="34" y1="28" x2="34" y2="41" stroke="#1565c0" stroke-width="1" opacity="0.6"/>

  <!-- Wheels -->
  <circle cx="24" cy="42" r="5.5" fill="#0d47a1"/>
  <circle cx="24" cy="42" r="2.8" fill="#90caf9"/>
  <circle cx="44" cy="42" r="5.5" fill="#0d47a1"/>
  <circle cx="44" cy="42" r="2.8" fill="#90caf9"/>

  <!-- Speed lines (left) -->
  <line x1="9"  y1="31" x2="16" y2="31" stroke="#64b5f6" stroke-width="1.5"
        stroke-linecap="round" opacity="0.7"/>
  <line x1="7"  y1="35" x2="14" y2="35" stroke="#64b5f6" stroke-width="1.5"
        stroke-linecap="round" opacity="0.45"/>
  <line x1="9"  y1="39" x2="15" y2="39" stroke="#64b5f6" stroke-width="1.5"
        stroke-linecap="round" opacity="0.25"/>
</svg>
