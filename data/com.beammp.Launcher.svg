<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark backing -->
  <rect width="128" height="128" rx="24" fill="#0f0721"/>
  <!-- Purple gradient fill -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Subtle top-shine -->
  <rect width="128" height="64" rx="24" fill="url(#shine)"/>

  <!-- Bold "B" lettermark -->
  <text x="52" y="88"
        font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif"
        font-weight="900"
        font-size="80"
        fill="white"
        text-anchor="middle">B</text>

  <!-- "MP" badge bottom-right -->
  <rect x="72" y="46" width="46" height="22" rx="7" fill="#c4b5fd"/>
  <text x="95" y="62"
        font-family="DejaVu Sans,Liberation Sans,Arial,sans-serif"
        font-weight="800"
        font-size="14"
        fill="#3b0764"
        text-anchor="middle">MP</text>
</svg>
