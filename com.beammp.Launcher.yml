app-id: com.beammp.Launcher
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: BeamMP-Launcher

finish-args:
  # Network access is required for multiplayer connectivity and mod downloads.
  - --share=network
  # Steam libraries can reside anywhere in the home directory (or custom paths
  # set by the user in Steam settings). Full home access is the minimum needed
  # to reliably locate the BeamNG.drive installation via libraryfolders.vdf.
  # Users with games on external drives mounted outside $HOME will need to
  # grant additional filesystem permissions via `flatpak override`.
  - --filesystem=home
  # D-Bus session bus and the Flatpak portal are required so that
  # flatpak-spawn --host can launch the game on the host system,
  # giving it access to the Steam runtime environment.
  - --socket=session-bus
  - --talk-name=org.freedesktop.Flatpak

modules:
  # nlohmann/json — header-only; built here so its cmake config is available
  # to the launcher's cmake without requiring vcpkg inside the sandbox.
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
      - -DJSON_Install=ON
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.11.3.tar.gz
        sha256: 0d8ef5af7f9794e3263480193c491549b2ba6cc74bb018906202ada498a79406

  # cpp-httplib — header-only; installed in header-only mode so the launcher
  # picks up find_package(httplib CONFIG REQUIRED) against system OpenSSL.
  - name: cpp-httplib
    buildsystem: cmake-ninja
    config-opts:
      - -DHTTPLIB_COMPILE=OFF
      - -DHTTPLIB_REQUIRE_OPENSSL=ON
      - -DHTTPLIB_REQUIRE_ZLIB=ON
    sources:
      - type: archive
        url: https://github.com/yhirose/cpp-httplib/archive/refs/tags/v0.18.5.tar.gz
        sha256: 731190e97acd63edce57cc3dacd496f57e7743bfc7933da7137cb3e93ec6c9a0

  - name: BeamMP-Launcher
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: .
